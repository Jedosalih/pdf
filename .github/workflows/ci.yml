name: CI

# Runs on every push to main and every PR. Never uses production secrets
# or data: every database/Redis/storage service is created fresh on the
# runner from docker-compose.yml and destroyed afterwards, and the .env
# files written below hold CI-only dummy values.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  static:
    name: Lint, typecheck, schema
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install app dependencies
        run: npm ci

      # prisma.config.ts requires DATABASE_URL even for validate/generate,
      # which never connect; a placeholder scoped to these steps.
      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      # Prisma 7 does not generate the client on install.
      - name: Generate Prisma client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (app)
        run: npm run typecheck

      # Each worker is an independently deployable package with its own
      # node_modules/tsconfig; the app typecheck excludes workers/.
      - name: Typecheck workers
        run: |
          for worker in pdf office ocr html cleanup; do
            echo "::group::workers/$worker"
            (cd "workers/$worker" && npm ci && npm run db:generate && npx tsc --noEmit)
            echo "::endgroup::"
          done

      # Static check of the production stack template (the example env
      # file holds placeholders only).
      - name: Validate production compose file
        run: docker compose -f docker-compose.prod.yml --env-file .env.production.example config --quiet

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Fails on any high/critical advisory in production dependencies
      # unless it is listed, with a reason and expiry, in
      # security/audit-allowlist.json. Reads lockfiles only.
      - name: Audit production dependencies
        run: node scripts/audit-gate.mjs . workers/pdf workers/office workers/ocr workers/html workers/cleanup

  build:
    name: Production build and images
    runs-on: ubuntu-latest
    needs: static
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Write CI env file
        run: |
          cat > .env <<'EOF'
          DATABASE_URL="postgresql://jdpdf:jdpdf@localhost:5432/jdpdf?schema=public"
          REDIS_URL="redis://localhost:6379"
          STORAGE_ENDPOINT="http://localhost:9000"
          STORAGE_REGION="auto"
          STORAGE_BUCKET="jdpdf-dev"
          STORAGE_ACCESS_KEY="jdpdf"
          STORAGE_SECRET_KEY="jdpdf12345"
          STORAGE_FORCE_PATH_STYLE="true"
          AUTH_SECRET="ci-only-not-a-real-secret-0000000000000000000000"
          GUEST_ID_SECRET="ci-only-not-a-real-secret-1111111111111111111111"
          NEXT_PUBLIC_SITE_URL="http://localhost:3000"
          EMAIL_FROM="JPdf CI <ci@localhost>"
          NODE_ENV="production"
          EOF

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Build app
        run: npm run build

      - name: Build workers
        run: |
          for worker in pdf office ocr html cleanup; do
            echo "::group::workers/$worker"
            (cd "workers/$worker" && npm ci && npm run db:generate && npm run build)
            echo "::endgroup::"
          done

      # The production app image (Dockerfile). Worker images are built in
      # the e2e job, from the same Dockerfiles production uses.
      - name: Build app image
        run: docker build --build-arg NEXT_PUBLIC_SITE_URL=https://ci.invalid -t jpdf-app:ci .

  e2e:
    name: Full stack E2E
    runs-on: ubuntu-latest
    needs: build
    # Building all five worker images from a cold cache (LibreOffice,
    # Tesseract and Chromium layers) on a 2-vCPU runner is slow; generous
    # but bounded, so a real hang still fails loudly.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # The worker images need well over the ~14 GB a stock runner has
      # free. Remove preinstalled toolchains this job never uses.
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null
          df -h /

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Write CI env file
        run: |
          cat > .env <<'EOF'
          DATABASE_URL="postgresql://jdpdf:jdpdf@localhost:5432/jdpdf?schema=public"
          SHADOW_DATABASE_URL="postgresql://jdpdf:jdpdf@localhost:5432/jdpdf_shadow?schema=public"
          REDIS_URL="redis://localhost:6379"
          STORAGE_ENDPOINT="http://localhost:9000"
          STORAGE_REGION="auto"
          STORAGE_BUCKET="jdpdf-dev"
          STORAGE_ACCESS_KEY="jdpdf"
          STORAGE_SECRET_KEY="jdpdf12345"
          STORAGE_FORCE_PATH_STYLE="true"
          CLAMD_HOST="localhost"
          CLAMD_PORT="3310"
          AUTH_SECRET="ci-only-not-a-real-secret-0000000000000000000000"
          GUEST_ID_SECRET="ci-only-not-a-real-secret-1111111111111111111111"
          NEXT_PUBLIC_SITE_URL="http://localhost:3000"
          EMAIL_FROM="JPdf CI <ci@localhost>"
          NODE_ENV="development"
          EOF

      # Postgres/Redis/SeaweedFS/ClamAV/Mailpit plus all five workers, built
      # from this repo's Dockerfiles: the same docker-compose.yml used in
      # local development, on fresh volumes.
      # One image per step: building all five in parallel (compose's
      # default) on a 2-vCPU / 7 GB runner thrashed for over an hour; one at
      # a time also makes each image's build time visible.
      # Registry pulls on shared runners can stall; bounded, retried, and
      # separate from builds so a stall is attributable.
      - name: Pull service images
        timeout-minutes: 15
        run: |
          for attempt in 1 2 3; do
            docker compose pull --ignore-buildable && exit 0
            echo "pull attempt $attempt failed; retrying"; sleep 20
          done
          exit 1

      - name: Build pdf-worker image
        run: docker compose build pdf-worker

      - name: Build cleanup-worker image
        run: docker compose build cleanup-worker

      - name: Build ocr-worker image
        run: docker compose build ocr-worker

      - name: Build office-worker image
        run: docker compose build office-worker

      - name: Build html-worker image
        run: docker compose build html-worker

      - name: Start the full stack (docker compose)
        timeout-minutes: 10
        run: docker compose up -d

      # Explicit readiness instead of `--wait`, which counts workers
      # restarting before migrations exist as failures.
      - name: Wait for infrastructure
        run: sh scripts/wait-for-stack.sh 600

      # `--wait` returns while clamav can still be "starting" (it has no
      # dependents); poll so the malware-scan test can't flake on it.
      - name: Wait for ClamAV to report healthy
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect pdf-clamav-1 --format '{{.State.Health.Status}}')
            echo "clamav health: $status ($i/60)"
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 5
          done
          echo "::error::clamav did not become healthy in time"
          docker logs pdf-clamav-1 --tail 50
          exit 1

      - name: Install app dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      # Fails if schema.prisma and the committed migrations disagree.
      - name: Check migrations match the schema
        run: |
          docker exec pdf-postgres-1 psql -U jdpdf -d jdpdf -c "CREATE DATABASE jdpdf_shadow"
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code

      - name: Seed the database
        run: npm run db:seed

      # Security regression tests that inspect PDF bytes with the real
      # qpdf/poppler binaries, so they run inside the worker images.
      - name: Redaction security regression test
        run: docker compose run --rm --no-deps pdf-worker node dist/redaction.test.js

      - name: qpdf password-handling test
        run: docker compose run --rm --no-deps pdf-worker node dist/qpdfJob.test.js

      - name: Cleanup sweep test
        run: docker compose run --rm --no-deps cleanup-worker node dist/sweep.test.js

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # `github` reporter: each failing test becomes a workflow annotation
      # (file, line, message), readable without downloading logs.
      - name: Run the E2E suite
        run: npx playwright test --workers=1 --reporter=list,github

      - name: Show service state on failure
        if: failure() || cancelled()
        run: sh scripts/ci-diagnostics.sh

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          # playwright.config.ts uses the "list" reporter only; per-failure
          # traces/screenshots land in test-results/.
          path: test-results/
          retention-days: 7

      - name: Tear down the stack
        if: always()
        run: docker compose down -v
