# Production stack TEMPLATE -- not deployed anywhere yet (docs/DEPLOYMENT.md).
#
#   cp .env.production.example .env.production   # fill in real secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Differences from the local-dev docker-compose.yml, all deliberate:
# - Every secret comes from .env.production (never committed); compose
#   refuses to start if a required one is missing (`${VAR:?}`).
# - Only the app (3000) and MinIO's S3 API (9000) are published, and only
#   on 127.0.0.1, for a reverse proxy on the same host that terminates
#   HTTPS and appends X-Forwarded-For (TRUSTED_PROXY_HOPS=1). Postgres,
#   Redis and ClamAV are not reachable from outside the compose networks.
# - Redis requires a password.
# - Each service has its own least-privilege Postgres role
#   (deploy/postgres) and MinIO access key (deploy/minio); the admin/root
#   credentials are used only by the one-shot init/migrate services.
# - Images are pinned by digest.
#
# Networks: `backend` is internal (no route out) and holds everything
# that talks to Postgres/Redis/MinIO. Workers are ONLY on `backend`, so a
# compromised engine has no outbound network. `edge` is a normal bridge
# used for the published ports and outbound traffic of the app and
# ClamAV (freshclam needs to download definitions).

x-worker-env: &worker-env
  DATABASE_URL: postgresql://jpdf_worker:${POSTGRES_WORKER_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}?schema=public
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
  STORAGE_ENDPOINT: http://minio:9000
  STORAGE_REGION: auto
  STORAGE_BUCKET: ${STORAGE_BUCKET:?}
  STORAGE_ACCESS_KEY: ${STORAGE_WORKER_ACCESS_KEY:?}
  STORAGE_SECRET_KEY: ${STORAGE_WORKER_SECRET_KEY:?}
  STORAGE_FORCE_PATH_STYLE: "true"
  NODE_ENV: production

x-worker: &worker
  restart: unless-stopped
  networks: [backend]
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    minio-init: { condition: service_completed_successfully }
    migrate: { condition: service_completed_successfully }
  environment: *worker-env

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?}
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]
    networks: [backend, edge]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://jpdf_app:${POSTGRES_APP_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
      # The app both talks to storage and signs download URLs, so this must
      # be the PUBLIC storage origin the reverse proxy serves (browsers
      # fetch the signed URL directly).
      STORAGE_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:?}
      STORAGE_REGION: auto
      STORAGE_BUCKET: ${STORAGE_BUCKET:?}
      STORAGE_ACCESS_KEY: ${STORAGE_APP_ACCESS_KEY:?}
      STORAGE_SECRET_KEY: ${STORAGE_APP_SECRET_KEY:?}
      STORAGE_FORCE_PATH_STYLE: "true"
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
      AUTH_SECRET: ${AUTH_SECRET:?}
      GUEST_ID_SECRET: ${GUEST_ID_SECRET:?}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # One-shot: schema migrations, tool/limit seed, and per-role grants, as
  # the admin role. Everything else depends on it completing.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?}
    restart: "no"
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}?schema=public
    command: >
      sh -c "npx prisma migrate deploy &&
             npm run db:seed &&
             npx prisma db execute --file deploy/postgres/grants.sql"

  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    networks: [backend]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?}
      POSTGRES_WORKER_PASSWORD: ${POSTGRES_WORKER_PASSWORD:?}
      POSTGRES_CLEANUP_PASSWORD: ${POSTGRES_CLEANUP_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    networks: [backend]
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}

  # See docs/DEPLOYMENT.md: MinIO no longer publishes maintained community
  # images; this digest is the last one available and will not receive
  # security fixes. Prefer a managed S3-compatible store (R2/S3) -- only
  # the STORAGE_* variables change -- or a maintained MinIO distribution.
  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: server /data
    networks: [backend, edge]
    ports: ["127.0.0.1:9000:9000"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    restart: "no"
    networks: [backend]
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      STORAGE_BUCKET: ${STORAGE_BUCKET:?}
      STORAGE_APP_ACCESS_KEY: ${STORAGE_APP_ACCESS_KEY:?}
      STORAGE_APP_SECRET_KEY: ${STORAGE_APP_SECRET_KEY:?}
      STORAGE_WORKER_ACCESS_KEY: ${STORAGE_WORKER_ACCESS_KEY:?}
      STORAGE_WORKER_SECRET_KEY: ${STORAGE_WORKER_SECRET_KEY:?}
      STORAGE_CLEANUP_ACCESS_KEY: ${STORAGE_CLEANUP_ACCESS_KEY:?}
      STORAGE_CLEANUP_SECRET_KEY: ${STORAGE_CLEANUP_SECRET_KEY:?}
    volumes:
      - ./deploy/minio/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]

  clamav:
    image: clamav/clamav-debian:stable@sha256:cc16781fe005e49de6a8fc1231b63b265f74b18fc2a6347c670c35716914c3b6
    restart: unless-stopped
    networks: [backend, edge]
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  pdf-worker:
    <<: *worker
    build: { context: ., dockerfile: workers/pdf/Dockerfile }
    deploy: { resources: { limits: { cpus: "2.0", memory: 1536M } } }

  office-worker:
    <<: *worker
    build: { context: ., dockerfile: workers/office/Dockerfile }
    deploy: { resources: { limits: { cpus: "2.0", memory: 3072M } } }

  ocr-worker:
    <<: *worker
    build: { context: ., dockerfile: workers/ocr/Dockerfile }
    deploy: { resources: { limits: { cpus: "2.0", memory: 2048M } } }

  html-worker:
    <<: *worker
    build: { context: ., dockerfile: workers/html/Dockerfile }
    shm_size: "1gb"
    deploy: { resources: { limits: { cpus: "2.0", memory: 3072M } } }

  cleanup-worker:
    <<: *worker
    build: { context: ., dockerfile: workers/cleanup/Dockerfile }
    deploy: { resources: { limits: { cpus: "0.5", memory: 256M } } }
    environment:
      <<: *worker-env
      DATABASE_URL: postgresql://jpdf_cleanup:${POSTGRES_CLEANUP_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}?schema=public
      STORAGE_ACCESS_KEY: ${STORAGE_CLEANUP_ACCESS_KEY:?}
      STORAGE_SECRET_KEY: ${STORAGE_CLEANUP_SECRET_KEY:?}

volumes:
  postgres_data:
  redis_data:
  minio_data:
  clamav_data:

networks:
  backend:
    internal: true
  edge: {}
