# Production stack for a single Docker host (docs/DEPLOYMENT.md).
#
#   cp .env.production.example .env.production   # fill in real secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Differences from the local-dev docker-compose.yml, all deliberate:
# - Only the Caddy reverse proxy is reachable from outside (80/443, HTTPS
#   with automatic certificates). Nothing else publishes a port: Postgres,
#   Redis, storage, ClamAV, the workers and the app itself are only on the
#   compose networks.
# - Every secret comes from .env.production (never committed); compose
#   refuses to start if a required one is missing (`${VAR:?}`).
# - Redis requires a password.
# - Each service has its own least-privilege Postgres role
#   (deploy/postgres) and object-storage key (deploy/storage); admin
#   credentials are used only by the one-shot init/migrate services.
# - Object storage is SeaweedFS (Apache-2.0, actively maintained) instead
#   of MinIO, whose community images are no longer published.
# - Images are pinned by digest.
#
# Networks: `backend` is internal (no route out) and holds everything that
# talks to Postgres/Redis/storage; the workers are ONLY on it, so a
# compromised engine has no outbound network. `edge` is a normal bridge for
# the proxy, the app (outbound SMTP) and ClamAV (definition updates).

# Fixed project name: volume names (jpdf_postgres_data, jpdf_storage_data,
# ...) are what deploy/backup.sh and the restore steps refer to.
name: jpdf

x-worker-env: &worker-env
  DATABASE_URL: postgresql://jpdf_worker:${POSTGRES_WORKER_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}?schema=public
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
  STORAGE_ENDPOINT: http://storage:8333
  STORAGE_REGION: us-east-1
  STORAGE_BUCKET: ${STORAGE_BUCKET:?}
  STORAGE_ACCESS_KEY: ${STORAGE_WORKER_ACCESS_KEY:?}
  STORAGE_SECRET_KEY: ${STORAGE_WORKER_SECRET_KEY:?}
  STORAGE_FORCE_PATH_STYLE: "true"
  NODE_ENV: production

x-worker: &worker
  restart: unless-stopped
  networks: [backend]
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    storage: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }
  environment: *worker-env
  logging: &logging
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  proxy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    # edge for the public ports; backend to reach app and storage.
    networks: [edge, backend]
    depends_on:
      app: { condition: service_healthy }
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?}
      FILES_DOMAIN: ${FILES_DOMAIN:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: https://${APP_DOMAIN:?}
    restart: unless-stopped
    networks: [backend, edge]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      storage: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://jpdf_app:${POSTGRES_APP_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
      STORAGE_ENDPOINT: http://storage:8333
      # Download URLs are signed for the public storage hostname (served by
      # the proxy, GET/HEAD only); every other storage call stays internal.
      STORAGE_PUBLIC_ENDPOINT: https://${FILES_DOMAIN:?}
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: ${STORAGE_BUCKET:?}
      STORAGE_ACCESS_KEY: ${STORAGE_APP_ACCESS_KEY:?}
      STORAGE_SECRET_KEY: ${STORAGE_APP_SECRET_KEY:?}
      STORAGE_FORCE_PATH_STYLE: "true"
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
      AUTH_SECRET: ${AUTH_SECRET:?}
      GUEST_ID_SECRET: ${GUEST_ID_SECRET:?}
      # Verification / password-reset email over plain SMTP (TLS required).
      SMTP_HOST: ${SMTP_HOST:?}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:?}
      NEXT_PUBLIC_SITE_URL: https://${APP_DOMAIN:?}
      # Exactly one proxy (Caddy) appends X-Forwarded-For.
      TRUSTED_PROXY_HOPS: "1"
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *logging

  # One-shot: schema migrations, tool/limit seed and per-role grants, as
  # the admin role. Everything that uses the database waits for it.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: https://${APP_DOMAIN:?}
    restart: "no"
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}?schema=public
    command: >
      sh -c "npx prisma migrate deploy &&
             npm run db:seed &&
             npx prisma db execute --file deploy/postgres/grants.sql"
    logging: *logging

  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    networks: [backend]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?}
      POSTGRES_WORKER_PASSWORD: ${POSTGRES_WORKER_PASSWORD:?}
      POSTGRES_CLEANUP_PASSWORD: ${POSTGRES_CLEANUP_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    networks: [backend]
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    logging: *logging

  # S3-compatible object storage: single-node SeaweedFS (master + volume +
  # filer + S3 gateway). Its entrypoint renders the per-service S3
  # identities from the environment, starts the server and creates the
  # bucket; the container is healthy only once the bucket exists, so
  # dependents wait for service_healthy (no one-shot init containers).
  # Unauthenticated requests are refused.
  storage:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    restart: unless-stopped
    networks: [backend]
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      STORAGE_BUCKET: ${STORAGE_BUCKET:?}
      S3_CONFIG: /etc/seaweedfs/s3.json
      RENDER_S3_CONFIG: "1"
      STORAGE_APP_ACCESS_KEY: ${STORAGE_APP_ACCESS_KEY:?}
      STORAGE_APP_SECRET_KEY: ${STORAGE_APP_SECRET_KEY:?}
      STORAGE_WORKER_ACCESS_KEY: ${STORAGE_WORKER_ACCESS_KEY:?}
      STORAGE_WORKER_SECRET_KEY: ${STORAGE_WORKER_SECRET_KEY:?}
      STORAGE_CLEANUP_ACCESS_KEY: ${STORAGE_CLEANUP_ACCESS_KEY:?}
      STORAGE_CLEANUP_SECRET_KEY: ${STORAGE_CLEANUP_SECRET_KEY:?}
    volumes:
      - storage_data:/data
      - ./deploy/storage/entrypoint.sh:/entrypoint.sh:ro
      - ./deploy/storage/render-s3-config.sh:/render-s3-config.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/storage-ready && nc -z 127.0.0.1 8333"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 15s
    logging: *logging

  clamav:
    image: clamav/clamav-debian:stable@sha256:cc16781fe005e49de6a8fc1231b63b265f74b18fc2a6347c670c35716914c3b6
    restart: unless-stopped
    networks: [backend, edge]
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    logging: *logging

  pdf-worker:
    <<: *worker
    build: { context: ., dockerfile: workers/pdf/Dockerfile }
    deploy: { resources: { limits: { cpus: "2.0", memory: 1536M } } }

  office-worker:
    <<: *worker
    build: { context: ., dockerfile: workers/office/Dockerfile }
    deploy: { resources: { limits: { cpus: "2.0", memory: 3072M } } }

  ocr-worker:
    <<: *worker
    build: { context: ., dockerfile: workers/ocr/Dockerfile }
    deploy: { resources: { limits: { cpus: "2.0", memory: 2048M } } }

  html-worker:
    <<: *worker
    build: { context: ., dockerfile: workers/html/Dockerfile }
    shm_size: "1gb"
    deploy: { resources: { limits: { cpus: "2.0", memory: 3072M } } }

  cleanup-worker:
    <<: *worker
    build: { context: ., dockerfile: workers/cleanup/Dockerfile }
    deploy: { resources: { limits: { cpus: "0.5", memory: 256M } } }
    environment:
      <<: *worker-env
      DATABASE_URL: postgresql://jpdf_cleanup:${POSTGRES_CLEANUP_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}?schema=public
      STORAGE_ACCESS_KEY: ${STORAGE_CLEANUP_ACCESS_KEY:?}
      STORAGE_SECRET_KEY: ${STORAGE_CLEANUP_SECRET_KEY:?}

volumes:
  postgres_data:
  redis_data:
  storage_data:
  clamav_data:
  caddy_data:
  caddy_config:

networks:
  backend:
    internal: true
  edge: {}
