# LOCAL DEVELOPMENT AND CI ONLY. The credentials below are fixed, public
# dev values and every published port is bound to 127.0.0.1. Never deploy
# this file -- production uses docker-compose.prod.yml (see
# docs/DEPLOYMENT.md). Run an isolated copy for tests with its own
# volumes via `docker compose -p jpdf-test ...`.
services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    environment:
      POSTGRES_USER: jdpdf
      POSTGRES_PASSWORD: jdpdf
      POSTGRES_DB: jdpdf
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jdpdf"]
      interval: 5s
      timeout: 5s
      retries: 10
    # On `default` (for the `ports:` mapping the app running on the host
    # needs) *and* `restricted` (so the workers, which are deliberately
    # NOT on `default`, can still reach it by container name). See the
    # `networks` block at the bottom of this file for why one internal-
    # only network isn't enough on its own.
    networks: [default, restricted]

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [default, restricted]

  # S3-compatible object storage for local dev — same API surface as R2/S3
  # in production (see lib/storage).
  # S3-compatible object storage for local dev/CI: SeaweedFS, the same
  # engine production uses (docker-compose.prod.yml). MinIO was used before
  # 2026-10-21, but its images can no longer be pulled from Docker Hub; the
  # old `minio_data` volume is left untouched (docs/DEPLOYMENT.md).
  # Host port 9000 maps to SeaweedFS's S3 port so existing .env files
  # (STORAGE_ENDPOINT=http://localhost:9000) keep working. One dev identity
  # with the public dev credentials (deploy/dev/s3-dev.json).
  storage:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    restart: unless-stopped
    # Starts SeaweedFS and creates the bucket; healthy only once the bucket
    # exists (deploy/storage/entrypoint.sh), so dependents just wait for
    # service_healthy -- no one-shot init container.
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      STORAGE_BUCKET: jdpdf-dev
      S3_CONFIG: /etc/seaweedfs/s3.json
    ports:
      - "127.0.0.1:9000:8333"
    volumes:
      - storage_data:/data
      - ./deploy/dev/s3-dev.json:/etc/seaweedfs/s3.json:ro
      - ./deploy/storage/entrypoint.sh:/entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/storage-ready && nc -z 127.0.0.1 8333"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 15s
    networks: [default, restricted]

  # Local SMTP capture server (dev/CI only): every email the app sends is
  # caught here instead of being delivered -- read it at
  # http://localhost:8025, and the E2E suite reads verification/reset
  # links from its API. With SMTP_HOST unset outside production the app
  # sends to localhost:1025 (lib/email/mailer.ts).
  mailpit:
    image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: "5000"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Malware scanning (docs/SECURITY.md §9) -- on `default`, not
  # `restricted`: unlike the workers, clamd needs outbound internet
  # access for `freshclam` to keep virus definitions current, which is
  # essential to the scanner's own effectiveness, not just "nice to have."
  # It never processes a URL or executes anything based on a scanned
  # file's content, so its trust/risk profile is closer to
  # postgres/redis/storage (trusted, vendored infrastructure) than to a
  # worker parsing hostile input with an engine that could be exploited.
  clamav:
    image: clamav/clamav-debian:stable@sha256:cc16781fe005e49de6a8fc1231b63b265f74b18fc2a6347c670c35716914c3b6
    restart: unless-stopped
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  pdf-worker:
    build:
      context: .
      dockerfile: workers/pdf/Dockerfile
    restart: unless-stopped
    # BullMQ concurrency: 2 (workers/pdf/src/index.ts) -- sized for two
    # concurrent qpdf/Ghostscript/poppler processes or pureCompute
    # subprocesses, with headroom, not a tight fit.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://jdpdf:jdpdf@postgres:5432/jdpdf?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://storage:8333
      STORAGE_REGION: auto
      STORAGE_BUCKET: jdpdf-dev
      STORAGE_ACCESS_KEY: jdpdf
      STORAGE_SECRET_KEY: jdpdf12345
      STORAGE_FORCE_PATH_STYLE: "true"
      NODE_ENV: production
    # `restricted` only, never `default` -- this container has no route
    # to the outside world at all (see the `networks` block below).
    networks: [restricted]

  office-worker:
    build:
      context: .
      dockerfile: workers/office/Dockerfile
    restart: unless-stopped
    # LibreOffice headless is the most memory-hungry engine in this repo;
    # concurrency: 2 (workers/office/src/index.ts) -- two soffice
    # instances can each realistically want 1GB+ on a large document.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3072M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://jdpdf:jdpdf@postgres:5432/jdpdf?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://storage:8333
      STORAGE_REGION: auto
      STORAGE_BUCKET: jdpdf-dev
      STORAGE_ACCESS_KEY: jdpdf
      STORAGE_SECRET_KEY: jdpdf12345
      STORAGE_FORCE_PATH_STYLE: "true"
      NODE_ENV: production
    networks: [restricted]

  ocr-worker:
    build:
      context: .
      dockerfile: workers/ocr/Dockerfile
    restart: unless-stopped
    # concurrency: 2 (workers/ocr/src/index.ts) -- Tesseract is CPU-bound
    # per page more than memory-hungry, but OCRmyPDF's own Ghostscript/
    # qpdf steps add real headroom needs on larger documents.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://jdpdf:jdpdf@postgres:5432/jdpdf?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://storage:8333
      STORAGE_REGION: auto
      STORAGE_BUCKET: jdpdf-dev
      STORAGE_ACCESS_KEY: jdpdf
      STORAGE_SECRET_KEY: jdpdf12345
      STORAGE_FORCE_PATH_STYLE: "true"
      NODE_ENV: production
    networks: [restricted]

  html-worker:
    build:
      context: .
      dockerfile: workers/html/Dockerfile
    restart: unless-stopped
    # Chromium's default 64MB /dev/shm under Docker is too small and
    # causes real, hard-to-diagnose renderer crashes — this is a
    # well-known Playwright/Docker requirement, unrelated to the sandbox
    # security posture above.
    shm_size: "1gb"
    # concurrency: 2 (workers/html/src/index.ts) -- headless Chromium is
    # the single heaviest process in this repo; two concurrent render
    # contexts need real headroom beyond shm_size alone.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3072M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://jdpdf:jdpdf@postgres:5432/jdpdf?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://storage:8333
      STORAGE_REGION: auto
      STORAGE_BUCKET: jdpdf-dev
      STORAGE_ACCESS_KEY: jdpdf
      STORAGE_SECRET_KEY: jdpdf12345
      STORAGE_FORCE_PATH_STYLE: "true"
      NODE_ENV: production
    networks: [restricted]

  # Periodic housekeeping (docs/DECISIONS.md, workers/cleanup/src/sweep.ts):
  # expired guest files, old trashed files, and jobs stuck in PROCESSING
  # from a crashed worker. Schedules its own recurring BullMQ job at
  # startup (idempotent) rather than relying on an external cron daemon,
  # keeping it the same "long-running container" shape as every other
  # worker here. Pure DB/Redis/storage operations, no engine binaries --
  # lightweight limits reflect that.
  cleanup-worker:
    build:
      context: .
      dockerfile: workers/cleanup/Dockerfile
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://jdpdf:jdpdf@postgres:5432/jdpdf?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://storage:8333
      STORAGE_REGION: auto
      STORAGE_BUCKET: jdpdf-dev
      STORAGE_ACCESS_KEY: jdpdf
      STORAGE_SECRET_KEY: jdpdf12345
      STORAGE_FORCE_PATH_STYLE: "true"
      NODE_ENV: production
    networks: [restricted]

volumes:
  postgres_data:
  redis_data:
  storage_data:
  clamav_data:

networks:
  # Two networks, not one, because a single `internal: true` network
  # can't do both jobs at once: Docker's published-port (`ports:`)
  # mechanism relies on the same NAT/bridge machinery that `internal:
  # true` deliberately disables, so an internal network's containers
  # cannot be reached from the host via `ports:` at all (found the hard
  # way -- Storage/Postgres/Redis's host port mappings silently stopped
  # working, breaking the app's own connections to them, when they were
  # first put on a single internal network alongside the workers).
  #
  # `default` (unrestricted): postgres/redis/storage only, purely so their
  # `ports:` mappings keep working for the app running on the host.
  #
  # `restricted` (`internal: true`): every service actually needs to be
  # reachable from the four workers by container name -- postgres/redis/
  # storage join this too, in *addition* to `default` -- but the workers
  # themselves are ONLY on this network, never on `default`, so they have
  # no route to the outside world at all. This is the network-level
  # egress backstop `workers/html`'s own SSRF mitigation
  # (workers/html/src/render.ts's context.route() blocking) already
  # documented as required. Build-time networking (apt-get/npm install/
  # playwright install in each Dockerfile) is unaffected -- `internal:
  # true` only restricts already-built containers at runtime, never
  # `docker build` itself.
  default: {}
  restricted:
    internal: true
